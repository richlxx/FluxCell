# ── 几何 ──
geometry:
  electrode_height: 0.065         # [m]
  electrode_width: 1.58           # [m]
  particle_mesh_cells: 20         # 颗粒径向控制体数
  electrolyte_mesh_cells: 100     # 厚度方向控制体数

# ── 环境 ──
kinetics:
  temperature: 298.15             # T [K]

# ── 电池 ──
cell:
  capacity: 5.0                   # 名义容量 [Ah]
  initial_soc: 1.0                # 初始荷电状态 0~1
  # SOC → 嵌入率线性映射端点（PyBaMM initial_soc 反推值：0%/100% SOC 平衡
  # 电压 2.5V/4.2V + 电极锂守恒联立求解；论文表 4 值与电极容量比不自洽）
  neg_stoich_at_soc0: 0.026346    # 负极嵌入率 x @0% SOC
  neg_stoich_at_soc1: 0.910618    # 负极嵌入率 x @100% SOC
  pos_stoich_at_soc0: 0.853975    # 正极嵌入率 y @0% SOC
  pos_stoich_at_soc1: 0.263845    # 正极嵌入率 y @100% SOC

