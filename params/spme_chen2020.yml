# ══════════════════════════════════════════════════════════════
#  FluxCell SPMe 参数集 — Chen2020 (LG M50, 5 Ah)
#  参考: Chen et al., J. Electrochem. Soc. 167, 080534 (2020)
#  与 PyBaMM pybamm.input.parameters.lithium_ion.Chen2020 对齐
#  固相部分与 chen2020.yml 相同，电解液相为 SPMe 扩展
# ══════════════════════════════════════════════════════════════
model: SPMe

# ── 负极 (石墨 Graphite_LGM50) ──
negative_electrode:
  material: graphite_LGM50
  thickness: 85.2e-6              # L_n [m]
  particle_radius: 5.86e-6        # R_n [m]
  active_fraction: 0.75           # ε_s,n 活性物质体积分数
  diffusion_coefficient: 3.3e-14  # D_s,n [m²/s]
  max_concentration: 33133.0      # c_s_max,n [mol/m³]
  exchange_current_density: 6.48e-7   # m_ref,n [(A/m²)(m³/mol)^1.5]
  activation_energy: 35000.0      # E_r,n [J/mol]

# ── 正极 (NMC532 NMC_LGM50) ──
positive_electrode:
  material: nmc_LGM50
  thickness: 75.6e-6              # L_p [m]
  particle_radius: 5.22e-6        # R_p [m]
  active_fraction: 0.665          # ε_s,p
  diffusion_coefficient: 4.0e-15  # D_s,p [m²/s]
  max_concentration: 63104.0      # c_s_max,p [mol/m³]
  exchange_current_density: 3.42e-6   # m_ref,p [(A/m²)(m³/mol)^1.5]
  activation_energy: 17800.0      # E_r,p [J/mol]

# ── 隔膜 ──
separator:
  thickness: 12.0e-6              # [m]

# ── 电解液 (LiPF6 EC:DMC，SPMe 1D 传输) ──
electrolyte:
  concentration: 1000.0           # c_e 参考浓度 [mol/m³]（BV 动力学用）
  initial_concentration: 1000.0   # 初始浓度 [mol/m³]
  diffusivity: 1.7694e-10         # D_e [m²/s]（Nyman2008 @ c=1000；PyBaMM Chen2020）
  transference_number: 0.2594     # t₊ 阳离子迁移数（PyBaMM Chen2020）
  porosity_neg: 0.25              # 负极孔隙率 ε_e,n = 1 − ε_s,n
  porosity_sep: 0.47              # 隔膜孔隙率（PyBaMM Chen2020）
  porosity_pos: 0.335             # 正极孔隙率 ε_e,p = 1 − ε_s,p
  bruggeman_exponent: 1.5         # Bruggeman 指数（D^eff = D·ε^brug）
  conductivity: 0.9487            # κ [S/m]（Nyman2008 @ c=1000；无表时回退常量）

