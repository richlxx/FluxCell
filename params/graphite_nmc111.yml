# ── 负极 (石墨 Graphite) ──
negative_electrode:
  material: graphite
  diffusion_coefficient: 3.9e-14      # D_s [m²/s]
  conductivity: 100.0                  # σ_s [S/m]
  volume_fraction: 0.6                 # ε_s (活性物质体积分数)
  porosity: 0.3                        # ε_l (孔隙率)
  bruggeman: 1.5                       # 布鲁格曼指数
  exchange_current_density: 2.0e-11    # k [m/(mol^0.5·s)]
  max_concentration: 30555.0           # c_s_max [mol/m³]

# ── 正极 (NMC111) ──
positive_electrode:
  material: nmc111
  diffusion_coefficient: 1.0e-14
  conductivity: 10.0
  volume_fraction: 0.5
  porosity: 0.3
  bruggeman: 1.5
  exchange_current_density: 6.0e-11
  max_concentration: 51555.0

# ── 电解液 (1M LiPF6 in EC:DMC) ──
electrolyte:
  material: LiPF6_EC_DMC_1M
  diffusion_coefficient: 7.5e-10       # D_e [m²/s]
  conductivity: 1.0                    # κ [S/m]
  transference_number: 0.363           # t+₀

# ── 动力学 ──
kinetics:
  alpha_a: 0.5                         # 阳极传递系数
  alpha_c: 0.5                         # 阴极传递系数
  temperature: 298.15                  # T [K]

# ── 电池几何 ──
geometry:
  negative_thickness: 80.0e-6          # [m]
  separator_thickness: 25.0e-6         # [m]
  positive_thickness: 70.0e-6          # [m]
  electrode_height: 0.208              # [m]
  electrode_width: 0.137               # [m]
  negative_particle_radius: 10.0e-6    # [m]
  positive_particle_radius: 10.0e-6    # [m]
  negative_mesh_cells: 20
  separator_mesh_cells: 10
  positive_mesh_cells: 20
  particle_mesh_cells: 15

# ── 电池 ──
cell:
  # SOC → 嵌入率线性映射端点（演示参数集：按 OCP 拟合有效区间选取，
  # 非文献值；NMC111 拟合在 y < 0.12 时外推异常，故下限取 0.35）
  neg_stoich_at_soc0: 0.02        # 负极嵌入率 x @0% SOC
  neg_stoich_at_soc1: 0.95        # 负极嵌入率 x @100% SOC
  pos_stoich_at_soc0: 0.95        # 正极嵌入率 y @0% SOC
  pos_stoich_at_soc1: 0.35        # 正极嵌入率 y @100% SOC

